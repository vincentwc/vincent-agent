<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincent Agent - 知识库管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-brain text-blue-600 text-2xl"></i>
                <h1 class="text-xl font-bold text-gray-900">Vincent Agent 知识库</h1>
            </div>
            <button onclick="openCreateModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> 新建知识库
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-7xl mx-auto">
            
            <!-- Loading State -->
            <div id="loading" class="text-center py-20 hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i>
                <p class="mt-4 text-gray-500">加载中...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-20 hidden">
                <div class="bg-white p-8 rounded-2xl shadow-sm inline-block max-w-md">
                    <i class="fa-regular fa-folder-open text-6xl text-gray-300 mb-4"></i>
                    <h3 class="text-lg font-medium text-gray-900">暂无知识库</h3>
                    <p class="text-gray-500 mt-2 mb-6">创建一个新的知识库来开始管理您的文档资产。</p>
                    <button onclick="openCreateModal()" class="text-blue-600 hover:text-blue-700 font-medium">立即创建 &rarr;</button>
                </div>
            </div>

            <!-- KB Grid -->
            <div id="kbGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- KB Cards will be injected here -->
            </div>

            <!-- KB Details View (Hidden by default) -->
            <div id="kbDetails" class="hidden">
                <!-- Breadcrumb / Header -->
                <div class="flex items-center gap-4 mb-6">
                    <button onclick="showDashboard()" class="text-gray-500 hover:text-gray-700 bg-white p-2 rounded-lg shadow-sm border border-gray-200 transition-colors">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div>
                        <h2 id="detailTitle" class="text-2xl font-bold text-gray-900"></h2>
                        <p id="detailDesc" class="text-gray-500 text-sm mt-1"></p>
                    </div>
                </div>

                <!-- Action Bar -->
                <div class="flex justify-between items-center mb-6">
                    <div class="flex gap-3">
                        <div class="relative">
                            <input type="file" id="uploadInput" class="hidden" multiple accept=".pdf,.txt" onchange="handleFileSelect(event)">
                            <button onclick="document.getElementById('uploadInput').click()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                                <i class="fa-solid fa-cloud-arrow-up"></i> 上传文档
                            </button>
                        </div>
                    </div>
                    <div class="text-sm text-gray-500">
                        <span id="docCount">0</span> 个文档
                    </div>
                </div>

                <!-- Document List -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">文件名</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">大小</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">上传时间</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="docListBody" class="bg-white divide-y divide-gray-200">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                    <div id="docEmptyState" class="hidden text-center py-12">
                        <i class="fa-regular fa-file text-4xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500">暂无文档，请上传</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create/Edit Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 transform transition-all scale-100">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-900">新建知识库</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            
            <form id="kbForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="kbId" name="kbId">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">名称</label>
                    <input type="text" id="nameInput" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="例如：产品文档">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">描述 (可选)</label>
                    <textarea id="descInput" name="description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="简要描述该知识库的内容用途..."></textarea>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">取消</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors flex items-center gap-2">
                        <span id="submitBtnText">创建</span>
                        <i id="submitBtnSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3">
            <i id="toastIcon" class="fa-solid fa-check-circle text-green-400"></i>
            <span id="toastMessage">操作成功</span>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const TENANT_ID = "default_tenant"; 
        let currentKBs = [];
        let activeKBId = null;

        document.addEventListener('DOMContentLoaded', fetchKBs);

        // --- KB Management ---
        async function fetchKBs() {
            showLoading(true);
            try {
                const res = await fetch(`${API_BASE}/kb/list?tenant_id=${TENANT_ID}`);
                const json = await res.json();
                if (json.code !== 200) throw new Error(json.message);
                
                const data = json.data;
                currentKBs = data;
                renderKBs(data);
            } catch (error) {
                showToast('加载失败: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        function renderKBs(kbs) {
            const grid = document.getElementById('kbGrid');
            const empty = document.getElementById('emptyState');
            
            grid.innerHTML = '';
            
            if (kbs.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            grid.classList.remove('hidden');

            kbs.forEach(kb => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition-shadow relative group cursor-pointer';
                card.onclick = (e) => {
                    if (e.target.closest('button')) return; // Prevent triggering when clicking actions
                    openKBDetails(kb.id);
                };
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-blue-100 text-blue-600 w-10 h-10 rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-book"></i>
                        </div>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="openEditModal('${kb.id}')" class="text-gray-400 hover:text-blue-500 p-1.5 rounded-md hover:bg-blue-50 transition-colors" title="编辑">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteKB('${kb.id}')" class="text-gray-400 hover:text-red-500 p-1.5 rounded-md hover:bg-red-50 transition-colors" title="删除">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mb-2 truncate">${escapeHtml(kb.name)}</h3>
                    <p class="text-gray-500 text-sm mb-4 line-clamp-2 h-10">${escapeHtml(kb.description || '暂无描述')}</p>
                    <div class="flex items-center justify-between text-xs text-gray-400 pt-4 border-t border-gray-50">
                        <span><i class="fa-regular fa-clock mr-1"></i>${formatDate(kb.created_at)}</span>
                        <span class="bg-gray-100 px-2 py-1 rounded text-gray-500">ID: ${kb.id.slice(0,8)}...</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button[type="submit"]');
            const spinner = document.getElementById('submitBtnSpinner');
            const btnText = document.getElementById('submitBtnText');
            const kbId = document.getElementById('kbId').value;
            const isEdit = !!kbId;

            btn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = isEdit ? '保存中...' : '创建中...';

            const payload = {
                name: form.name.value,
                description: form.description.value,
                tenant_id: TENANT_ID
            };

            try {
                let url = `${API_BASE}/kb/create`;
                let method = 'POST';

                if (isEdit) {
                    url = `${API_BASE}/kb/${kbId}?tenant_id=${TENANT_ID}`;
                    method = 'PUT';
                }

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const json = await res.json();
                if (!res.ok || json.code !== 200) throw new Error(json.message || (isEdit ? '更新失败' : '创建失败'));
                
                showToast(isEdit ? '知识库已更新' : '知识库创建成功');
                closeModal();
                fetchKBs();
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = isEdit ? '保存' : '创建';
            }
        }

        async function deleteKB(id) {
            if (!confirm('确定要删除这个知识库吗？此操作无法撤销。')) return;

            try {
                const res = await fetch(`${API_BASE}/kb/${id}?tenant_id=${TENANT_ID}`, {
                    method: 'DELETE'
                });
                
                const json = await res.json();
                if (!res.ok || json.code !== 200) throw new Error(json.message || '删除失败');
                
                showToast('知识库已删除');
                fetchKBs();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // --- View Switching ---
        function showDashboard() {
            document.getElementById('kbGrid').classList.remove('hidden');
            document.getElementById('kbDetails').classList.add('hidden');
            // If empty state was showing before, logic in fetchKBs will handle it, but we can hide details for sure
            activeKBId = null;
            fetchKBs(); 
        }

        function openKBDetails(id) {
            const kb = currentKBs.find(k => k.id === id);
            if (!kb) return;
            
            activeKBId = id;
            document.getElementById('kbGrid').classList.add('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('kbDetails').classList.remove('hidden');
            
            document.getElementById('detailTitle').textContent = kb.name;
            document.getElementById('detailDesc').textContent = kb.description || '暂无描述';
            
            fetchDocuments(id);
        }

        // --- Document Management ---
        async function fetchDocuments(kbId) {
            const tbody = document.getElementById('docListBody');
            const empty = document.getElementById('docEmptyState');
            
            tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">加载中...</td></tr>';
            
            try {
                const res = await fetch(`${API_BASE}/kb/${kbId}/documents`);
                const json = await res.json();
                
                if (json.code !== 200) throw new Error(json.message);
                
                const docs = json.data;
                document.getElementById('docCount').textContent = docs.length;
                tbody.innerHTML = '';

                if (docs.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }
                
                empty.classList.add('hidden');
                
                docs.forEach(doc => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <i class="fa-regular fa-file-lines text-gray-400 mr-3"></i>
                                <a href="#" onclick="downloadDocument(event, '${doc.id}', '${escapeHtml(doc.filename)}')" class="text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline" title="点击下载">${escapeHtml(doc.filename)}</a>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${(doc.size / 1024).toFixed(1)} KB
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${formatDate(doc.created_at)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                已上传
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="deleteDocument('${doc.id}')" class="text-red-600 hover:text-red-900">删除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">加载失败</td></tr>';
            }
        }

        async function handleFileSelect(e) {
            const files = e.target.files;
            if (!files.length) return;
            
            const allowedTypes = ['pdf', 'txt'];

            for (let file of files) {
                const ext = file.name.split('.').pop().toLowerCase();
                if (!allowedTypes.includes(ext)) {
                    showToast(`不支持的文件类型: ${file.name}. 仅支持: ${allowedTypes.join(', ')}`, 'error');
                    continue;
                }
                await uploadFile(file);
            }
            e.target.value = ''; 
            fetchDocuments(activeKBId);
        }

        async function downloadDocument(event, docId, filename) {
            event.preventDefault();
            event.stopPropagation();
            
            try {
                const url = `${API_BASE}/kb/${activeKBId}/documents/${docId}/download`;
                
                // 创建临时链接触发下载
                const link = document.createElement('a');
                link.href = url;
                link.download = filename; // 尝试提示浏览器下载文件名
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showToast(`开始下载: ${filename}`);
            } catch (e) {
                showToast('下载请求失败', 'error');
            }
        }

        async function uploadFile(file) {
            const fd = new FormData();
            fd.append('file', file);
            
            try {
                showToast(`正在上传 ${file.name}...`);
                const res = await fetch(`${API_BASE}/kb/${activeKBId}/documents/upload`, {
                    method: 'POST',
                    body: fd
                });
                
                const json = await res.json();
                if (!res.ok || json.code !== 200) throw new Error(json.message || '上传失败');
                
                showToast(`${file.name} 上传成功`);
            } catch (e) {
                showToast(`${file.name} 上传失败: ${e.message}`, 'error');
            }
        }

        async function deleteDocument(docId) {
            if (!confirm('确定要删除这个文档吗？')) return;
            
            try {
                const res = await fetch(`${API_BASE}/kb/${activeKBId}/documents/${docId}`, {
                    method: 'DELETE'
                });
                
                const json = await res.json();
                if (!res.ok || json.code !== 200) throw new Error(json.message || '删除失败');
                
                showToast('文档已删除');
                fetchDocuments(activeKBId);
            } catch (e) {
                showToast('删除失败', 'error');
            }
        }

        // --- UI Helpers ---

        function openCreateModal() {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = '新建知识库';
            document.getElementById('submitBtnText').textContent = '创建';
            document.getElementById('kbForm').reset();
            document.getElementById('kbId').value = '';
        }

        function openEditModal(id) {
            const kb = currentKBs.find(k => k.id === id);
            if (!kb) return;

            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = '编辑知识库';
            document.getElementById('submitBtnText').textContent = '保存';
            
            document.getElementById('kbId').value = kb.id;
            document.getElementById('nameInput').value = kb.name;
            document.getElementById('descInput').value = kb.description || '';
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function showLoading(show) {
            const el = document.getElementById('loading');
            if (show) {
                el.classList.remove('hidden');
                document.getElementById('kbGrid').classList.add('hidden');
                document.getElementById('emptyState').classList.add('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const text = document.getElementById('toastMessage');
            
            text.textContent = msg;
            icon.className = type === 'success' 
                ? 'fa-solid fa-check-circle text-green-400' 
                : 'fa-solid fa-circle-exclamation text-red-400';
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(isoString) {
            return new Date(isoString).toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Close modal on outside click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });
    </script>
</body>
</html>
