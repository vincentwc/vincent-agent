<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincent Agent - 智能体管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-robot text-purple-600 text-2xl"></i>
                    <h1 class="text-xl font-bold text-gray-900">Vincent Agent</h1>
                </div>
                <nav class="flex gap-4">
                    <a href="/" class="text-gray-500 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">知识库</a>
                    <a href="/static/agent.html" class="bg-gray-100 text-gray-900 px-3 py-2 rounded-md text-sm font-medium">智能体</a>
                </nav>
            </div>
            <button onclick="openCreateModal()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> 新建智能体
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-7xl mx-auto">
            
            <!-- Loading State -->
            <div id="loading" class="text-center py-20 hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-purple-500"></i>
                <p class="mt-4 text-gray-500">加载中...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-20 hidden">
                <div class="bg-white p-8 rounded-2xl shadow-sm inline-block max-w-md">
                    <i class="fa-solid fa-robot text-6xl text-gray-300 mb-4"></i>
                    <h3 class="text-lg font-medium text-gray-900">暂无智能体</h3>
                    <p class="text-gray-500 mt-2 mb-6">创建一个智能体，配置模型并关联知识库。</p>
                    <button onclick="openCreateModal()" class="text-purple-600 hover:text-purple-700 font-medium">立即创建 &rarr;</button>
                </div>
            </div>

            <!-- Agent Grid -->
            <div id="agentGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards will be injected here -->
            </div>

        </div>
    </main>

    <!-- Create/Edit Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 transform transition-all scale-100 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-900">新建智能体</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            
            <form id="agentForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="agentId" name="agentId">
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">名称</label>
                    <input type="text" id="nameInput" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all" placeholder="例如：产品客服">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">描述 (可选)</label>
                    <textarea id="descInput" name="description" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all" placeholder="简要描述智能体用途..."></textarea>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">系统提示词 (Prompt)</label>
                    <textarea id="promptInput" name="prompt" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all" placeholder="你是一个有用的助手..."></textarea>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">关联知识库</label>
                    <div id="kbListContainer" class="space-y-2 max-h-40 overflow-y-auto border border-gray-200 rounded-lg p-3 bg-gray-50">
                        <p class="text-sm text-gray-400 text-center py-2">加载知识库中...</p>
                    </div>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">取消</button>
                    <button type="submit" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-colors flex items-center gap-2">
                        <span id="submitBtnText">创建</span>
                        <i id="submitBtnSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3">
            <i id="toastIcon" class="fa-solid fa-check-circle text-green-400"></i>
            <span id="toastMessage">操作成功</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/agent_manager.js"></script>
</body>
</html>
