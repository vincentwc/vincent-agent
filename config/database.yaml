# 数据库配置
# 默认配置为 SQLite，如果需要使用 PostgreSQL，请修改 url
# PostgreSQL 示例: postgresql+psycopg2://user:password@localhost:5432/dbname
# SQLite 示例: sqlite:///data/rag.db

url: "sqlite:///data/rag.db"
echo: false  # 是否打印 SQL 语句
pool_size: 5  # 连接池大小 (仅对 MySQL/PostgreSQL 有效)
max_overflow: 10 # 最大溢出连接数 (仅对 MySQL/PostgreSQL 有效)
